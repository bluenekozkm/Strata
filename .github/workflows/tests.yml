name: tests
on:
  push:
    branches: [main, engine-core]
  pull_request:

jobs:
  serve:
    # the server and the API against a mock engine: no GPU, no downloads, stdlib plus the pinned deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy jinja2 regex pyyaml psutil requests pillow pytest
      - run: python -m pytest serve -q
